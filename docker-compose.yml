services:
  peblar:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: peblar-loadbalancer:local
    container_name: peblar
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./.env:/var/www/html/.env
      - ./data:/data
      - ./logs:/var/www/html/storage/logs
    environment:
      DB_DATABASE: /data/database.sqlite
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/api/version"]
      interval: 30s
      timeout: 5s
      retries: 3
